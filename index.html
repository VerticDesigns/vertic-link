<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Customize your web tab title here -->
    <title>Get Photoshop</title>
    
    <!-- Custom favicon from your GitHub -->
    <link rel="icon" type="image/png" href="favicon.png">

    <script>
        // PASTE YOUR ADOBE AFFILIATE LINK HERE
        const affiliateURL = "https://prf.hn/l/20Bd3Lj";

        // Check for mobile variant configurations of the TikTok app container
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isTikTok = ua.includes("TikTok") || ua.includes("musical_ly") || ua.includes("trill");

        // The Second they click 'Open in Browser' and escape TikTok, send them instantly to Adobe
        if (!isTikTok) {
            window.location.replace(affiliateURL);
        }
    </script>

    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Top Center Text Layout */
        .header-container {
            margin-top: 100px;
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.4;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .sub-text {
            font-size: 16px;
            color: #666666;
            font-weight: 500;
            line-height: 1.5;
        }

        .highlight {
            background-color: #fff3cd;
            padding: 2px 6px;
            border-radius: 6px;
            color: #000000;
            font-weight: 700;
        }

        /* Clean CSS Bold Arrow - Will look identical on iOS & Android */
        .arrow-container {
            position: fixed;
            top: 25px;
            right: 15px; /* Decreased to move it closer to the right edge */
            z-index: 1000;
            animation: aggressiveBounce 2.5s infinite ease-in-out;
        }

        .arrow-icon {
            width: 24px;
            height: 24px;
            border-top: 8px solid #000000;  /* Adjust thickness here */
            border-left: 8px solid #000000; /* Adjust thickness here */
            transform: rotate(45deg);       /* Rotates the corner into an upward arrow */
            display: block;
        }

        @keyframes aggressiveBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

    <!-- CSS-driven arrow container -->
    <div class="arrow-container">
        <span class="arrow-icon"></span>
    </div>

    <div class="header-container">
        <h2>Tap the <span class="highlight">•••</span> button</h2>
        <div class="sub-text">and select <span class="highlight">"Open in browser"</span><br>to view the Photoshop deal safely.</div>
    </div>

</body>
</html>
