<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Get Photoshop</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f8f9fa;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; text-align: center;
        }
        .card {
            background: #ffffff; padding: 30px 24px;
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);

        }
        h2 { font-size: 22px; margin: 10px 0; color: #000000; }
        .instruction-text { font-size: 15px; line-height: 1.5; color: #555555; margin-bottom: 20px; }
        .highlight { font-weight: 700; color: #000000; background-color: #fff3cd; padding: 2px 4px; border-radius: 4px; }
        .action-button {
            display: inline-block; background-color: #0066cc; color: #ffffff;
            text-decoration: none; padding: 12px 24px; border-radius: 24px;
            font-weight: 600; font-size: 15px; width: 80%;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>

    <!-- Bouncing indicator arrow pointing to TikTok's top right menu -->
