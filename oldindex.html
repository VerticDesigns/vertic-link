<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Photoshop</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        
        /* The floating instruction card matching your style */
        .card {
            background: #ffffff;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 340px;
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .ps-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        /* Large TikTok browser cues pointing to top-right options */
        .arrow-indicator {
            position: fixed;
            top: 15px;
            right: 20px;
            font-size: 38px;
            font-weight: bold;
            color: #000000;
            animation: bounce 1.5s infinite;
            z-index: 1000;
        }

        h2 {
            font-size: 22px;
            margin: 10px 0;
            color: #000000;
        }

        .instruction-text {
            font-size: 15px;
            line-height: 1.5;
            color: #555555;
            margin-bottom: 20px;
        }

        .highlight {
            font-weight: 700;
            color: #000000;
            background-color: #fff3cd;
            padding: 2px 4px;
            border-radius: 4px;
        }

        /* Safe manual fallback button if they are already in an external browser */
        .action-button {
            display: inline-block;
            background-color: #0066cc;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
            width: 80%;
        }

        .action-button:hover {
            background-color: #0056b3;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <!-- Bouncing indicator arrow pointing to TikTok's ••• menu -->
    <div class="arrow-indicator">↑</div>

    <div class="card">
        <!-- Replaced with a clean SVG of the Photoshop layout box -->
        <svg class="ps-logo" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="14" fill="#001e36"/>
            <text x="50" y="62" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="#00c8ff" text-anchor="middle">Ps</text>
        </svg>

        <h2>Get Photoshop Here</h2>
        
        <p class="instruction-text">
            To ensure the deal tracks properly:<br>
            Tap the <span class="highlight">••• button</span> in the top right, then select <span class="highlight">"Open in browser"</span>.
        </p>

        <!-- Change YOUR_ADOBE_AFFILIATE_LINK here -->
        <a href="https://prf.hn/l/20Bd3Lj" class="action-button">👉 Open Photoshop Offer</a>
    </div>

</body>
</html>
